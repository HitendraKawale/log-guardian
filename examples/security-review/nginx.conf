# Include in nginx's http context. Use a private upstream reachable only via this gateway.
map $uri $security_route {
    default /other;
    /login /login;
}

log_format security_review escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","status":"$status","route":"$security_route"}';

server {
    listen 8080;
    access_log /var/log/nginx/security-review.jsonl security_review;
    location / {
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:9000;
    }
}
