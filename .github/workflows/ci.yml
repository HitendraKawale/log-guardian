name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.4
      - run: ruff check services ml
      - run: ruff format --check services ml

  manifests:
    name: validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize infrastructure/kubernetes > /dev/null

  test:
    name: ${{ matrix.name }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai-service
            path: services/ai-service
          - name: ingestion-service
            path: services/ingestion-service
          - name: ml
            path: ml
          - name: contract
            path: tests
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements-dev.txt

      - name: Start the stack
        run: docker compose -f infrastructure/docker/docker-compose.yml up --build -d

      - name: Wait for the services to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/readiness && curl -sf http://localhost:8001/health; then
              exit 0
            fi
            sleep 5
          done
          echo "stack did not come up in time"
          exit 1

      - name: Run end-to-end tests
        working-directory: tests
        run: python -m pytest integration -q

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: tests
        run: python -m pytest e2e -q

      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore

      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f infrastructure/docker/docker-compose.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v

  train-smoke:
    name: model training smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r ml/requirements.txt
          pip install -r services/ai-service/requirements.txt

      - name: Train model
        run: python ml/training/train.py
