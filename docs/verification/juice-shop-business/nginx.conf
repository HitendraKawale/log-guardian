events {}
http {
    map $uri $security_route {
        default /other;
        /rest/user/login /login;
        /rest/products/search /catalog;
        /api/BasketItems/ /cart;
    }
    log_format security_review escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","status":"$status","route":"$security_route"}';
    server {
        listen 8080;
        access_log /var/log/nginx/security-review.jsonl security_review;
        location / {
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $host;
            proxy_pass http://shop:3000;
        }
    }
}
